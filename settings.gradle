pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // The SDK and the two vendor eSign AARs it depends on are all published here. Note this is
        // esign-sample-app, not esign-android-sdk-v2 -- the SDK's source repo is private, and a
        // GitHub package inherits the visibility of the repo it is linked to, so the packages are
        // published from this public one instead. Pointing at the source repo returns 401.
        //
        // Credentials go in ~/.gradle/gradle.properties, never in this file -- it is public.
        // A token with read:packages is enough.
        //
        //     gpr.user=your-github-username
        //     gpr.key=ghp_...
        maven {
            url = "https://maven.pkg.github.com/surepassio/esign-sample-app"
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: providers.gradleProperty("gpr.user").getOrNull()
                password = System.getenv("GITHUB_TOKEN") ?: providers.gradleProperty("gpr.key").getOrNull()
            }
        }
    }
}
rootProject.name = "ESign Sample App"
include ':app'
